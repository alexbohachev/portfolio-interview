name: work05

on:
  push:
    paths:
      - "work05-docguard/**"
      - ".github/workflows/work05.yml"
  pull_request:
    paths:
      - "work05-docguard/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work05-docguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew && ./gradlew test --no-daemon