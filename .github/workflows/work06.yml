name: work06

on:
  push:
    paths:
      - "work06-bible-rag/**"
      - ".github/workflows/work06.yml"
  pull_request:
    paths:
      - "work06-bible-rag/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work06-bible-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/init_db.py && python scripts/seed_synthetic.py && python scripts/seed_golden.py
      - run: python scripts/build_index.py
      - run: python scripts/eval_recall.py
      - run: python scripts/lock.py
      - run: PYTHONPATH=src python -m pytest -q tests