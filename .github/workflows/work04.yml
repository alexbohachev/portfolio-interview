name: work04

on:
  push:
    paths:
      - "work04-ml-serving/**"
      - ".github/workflows/work04.yml"
  pull_request:
    paths:
      - "work04-ml-serving/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work04-ml-serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/seed_data.py
      - run: PYTHONPATH=src python -m work04 all
      - run: PYTHONPATH=src python -m pytest -q