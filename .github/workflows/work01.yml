name: work01

on:
  push:
    paths:
      - "work01-bank-marketing/**"
      - ".github/workflows/work01.yml"
  pull_request:
    paths:
      - "work01-bank-marketing/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work01-bank-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q
        env:
          PYTHONPATH: src