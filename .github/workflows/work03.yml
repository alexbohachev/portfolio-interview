name: work03

on:
  push:
    paths:
      - "work03-agent-workflow/**"
      - ".github/workflows/work03.yml"
  pull_request:
    paths:
      - "work03-agent-workflow/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work03-agent-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew 2>/dev/null || true
      - run: ./gradlew test -Dwork03.docker=true