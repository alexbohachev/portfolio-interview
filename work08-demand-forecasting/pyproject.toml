[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work08-demand-forecasting"
version = "1.0.0"
description = "Production Demand Forecasting with Seasonal Baselines, Rolling Backtesting and Serving"
authors = [{ name = "Alex Bohachev" }]
dependencies = [
    "lightgbm>=4.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "joblib>=1.3.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
