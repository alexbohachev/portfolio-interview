server:
  port: 8096
spring:
  application:
    name: docguard-gateway
  datasource:
    url: jdbc:h2:mem:docguard;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
retrieval:
  base-url: ${RETRIEVAL_URL:http://localhost:8097}
acl:
  file: ${ACL_FILE:config/acl.yaml}